name: Build and Submit QA IOS App

on:
  push:
    branches: [main]

jobs:
  build_ios:
    name: Build QA IOS App Binary
    type: build
    params:
      platform: ios
      profile: qa

  submit_ios_app:
    name: Submit QA Build to App Stores
    type: submit
    needs: [build_ios]
    env:
      EXPO_DEBUG: "1"
    params:
      platform: ios
      # In EAS, you reference the build job's ID like this:
      build_id: ${{ jobs.build_ios.exports.buildId }}
      profile: qa

  notification_teams:
    name: Notify Microsoft Teams
    type: custom
    needs: [submit_ios_app]
    # EAS uses standard Linux runners for custom jobs, but to run regardless of upstream failure, 
    # you typically have to handle it or separate the workflows because EAS doesn't fully support 'always()' yet.
    # If submit fails, by default dependent jobs are skipped in EAS.
    steps:
      - name: Send status to Teams
        env:
          TEAMS_WEBHOOK_URL: "https://defaultaa988e77b0e34f06aabede25235728.77.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/096e911d604d4dd888079d793342333c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=KzG5jznBNR16wX9Xem3NYI9_T25_Q7reFftMPTsbvHE"
          APP_VERSION: ${{ jobs.build_ios.exports.appVersion }}
          BUILD_NUMBER: ${{ jobs.build_ios.exports.appBuildVersion }}
        run: |
          # Note: Pulling version data directly out of EAS jobs into a custom shell step 
          # usually requires curling the Expo API or inspecting the build artifact metadata.
          
          curl -H "Content-Type: application/json" -d "{
              \"type\": \"message\",
              \"attachments\": [
                  {
                      \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                      \"content\": {
                          \"type\": \"AdaptiveCard\",
                          \"body\": [
                              {
                                  \"type\": \"TextBlock\",
                                  \"text\": \"LegalSynqV3 QA Build\",
                                  \"weight\": \"bolder\",
                                  \"size\": \"medium\"
                              },
                              {
                                  \"type\": \"FactSet\",
                                  \"facts\": [
                                      {\"title\": \"Workflow:\", \"value\": \"Build and Submit QA IOS App\"},
                                      {\"title\": \"Platform:\", \"value\": \"iOS\"},
                                      {\"title\": \"Profile:\", \"value\": \"QA\"},
                                      {\"title\": \"App Version:\", \"value\": \"$APP_VERSION\"},
                                      {\"title\": \"Build Number:\", \"value\": \"$BUILD_NUMBER\"}
                                  ]
                              }
                          ],
                          \"\$schema\": \"http://adaptivecards.io\",
                          \"version\": \"1.2\"
                      }
                  }
              ]
          }" $TEAMS_WEBHOOK_URL